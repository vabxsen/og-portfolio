<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Vaibhav Sen</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Served by Vercel for any unknown URL, so every path here is root-absolute -->
<style>
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("/assets/fonts/inter-tight-latin.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap; src: url("/assets/fonts/instrument-serif-latin.woff2") format("woff2"); }
  :root { --pink: #ffade4; --yellow: #fff570; --sky: #a3daf5; --magenta: #d747a7; --ink-64: rgba(0, 0, 0, .64);
    --font: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif; --serif: "Instrument Serif", Georgia, serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; padding: 3px; background: #000; font-family: var(--font); font-weight: 500; color: #000; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--magenta); outline-offset: 3px; border-radius: 12px; }
  .panel { min-height: calc(100vh - 6px); border-radius: 32px; background: #fff; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; overflow: hidden; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 26px; letter-spacing: -0.05em; }
  .logo i { width: 34px; height: 27px; background: var(--magenta); clip-path: polygon(50% 0, 62% 38%, 100% 22%, 72% 55%, 100% 100%, 50% 72%, 0 100%, 28% 55%, 0 22%, 38% 38%); }
  .tag { padding: 10px 16px; border-radius: 200px; background: rgba(0, 0, 0, .04); font-size: 18px; letter-spacing: -0.03em; }
  .digits { display: flex; justify-content: center; }
  .digit { width: min(30vw, 340px); aspect-ratio: 1; margin: 0 -2vw; border-radius: 50%; border: 6px solid #fff; display: grid; place-items: center; font-size: min(20vw, 220px); line-height: 1; letter-spacing: -0.07em; }
  .digit:nth-child(1) { background: var(--pink); transform: rotate(-8deg); }
  .digit:nth-child(2) { background: var(--yellow); position: relative; z-index: 1; }
  .digit:nth-child(3) { background: var(--sky); transform: rotate(8deg); }
  /* The 0 is a face whose eyes follow the cursor */
  .eyes { display: flex; gap: 14%; width: 58%; justify-content: center; }
  .eye { width: 34%; aspect-ratio: 1; border-radius: 50%; background: #fff; border: 4px solid #000; display: grid; place-items: center; }
  .pupil { width: 44%; aspect-ratio: 1; border-radius: 50%; background: #000; transition: transform .12s ease-out; }
  .copy { text-align: center; }
  h1 { font-size: clamp(40px, 7vw, 96px); line-height: .9; letter-spacing: -0.05em; }
  h1 span { font-family: var(--serif); font-weight: 400; }
  .copy p { margin: 18px auto 0; max-width: 460px; color: var(--ink-64); font-size: 20px; letter-spacing: -0.02em; }
  .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 32px; }
  .btn { padding: 14px 24px; border-radius: 200px; border: 2px solid #000; font-size: 20px; letter-spacing: -0.03em; transition: background .2s, color .2s; }
  .btn:hover { background: #000; color: #fff; }
  .btn-dark { background: #000; color: #fff; }
  .btn-dark:hover { background: var(--magenta); border-color: var(--magenta); }
  @media (max-width: 600px) {
    .panel { padding: 20px; border-radius: 24px; }
    .logo { font-size: 20px; } .logo i { width: 26px; height: 21px; } .tag { font-size: 14px; }
    .digit { border-width: 4px; } .eye { border-width: 3px; }
    .copy p { font-size: 17px; } .btn { font-size: 17px; padding: 12px 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .pupil { transition: none; } }
</style>
</head>
<body>
  <main class="panel">
    <div class="top">
      <a href="/" class="logo" aria-label="Vaibhav Sen home"><i aria-hidden="true"></i>VAIBHAV SEN</a>
      <span class="tag">Error 404</span>
    </div>

    <div class="digits" aria-hidden="true">
      <span class="digit">4</span>
      <span class="digit"><span class="eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></span></span>
      <span class="digit">4</span>
    </div>

    <div class="copy">
      <h1><span>Oops,</span> this page wandered off.</h1>
      <p>The link might be mistyped, or the page has moved. Everything else is right where you left it.</p>
      <div class="actions">
        <a class="btn btn-dark" href="/">Back to home</a>
        <a class="btn" href="/#work">See my work</a>
      </div>
    </div>
  </main>

<script>
  // Pupils lean toward the pointer (or a tapped point), capped inside the eye
  (() => {
    const eyes = [...document.querySelectorAll(".eye")];
    const look = (x, y) => eyes.forEach((eye) => {
      const r = eye.getBoundingClientRect();
      const dx = x - (r.left + r.width / 2);
      const dy = y - (r.top + r.height / 2);
      const dist = Math.hypot(dx, dy) || 1;
      const max = r.width * 0.22;
      const travel = Math.min(max, dist / 8);
      eye.firstElementChild.style.transform = `translate(${(dx / dist) * travel}px, ${(dy / dist) * travel}px)`;
    });
    window.addEventListener("pointermove", (e) => look(e.clientX, e.clientY), { passive: true });
    window.addEventListener("pointerdown", (e) => look(e.clientX, e.clientY), { passive: true });
  })();
</script>
</body>
</html>
